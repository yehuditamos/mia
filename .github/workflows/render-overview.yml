name: Render official overview only
on:
  push:
    paths:
      - '.github/workflows/render-overview.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render overview
        run: |
          mkdir -p quick
          curl -L --fail 'https://www.yigal-group.com/_files/ugd/d42bfc_47644bb277c8494b8cf9686380453281.pdf' -o /tmp/overview.pdf
          pdftoppm -f 1 -singlefile -png -scale-to 2400 /tmp/overview.pdf quick/overview
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add quick/overview.png
          git commit -m 'Add high resolution official overview [skip ci]'
          git push
